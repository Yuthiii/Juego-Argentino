
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clásico Argentino</title>

<style>
:root {
    --crema: #f5e8c9;
    --marron: #754322;
    --verde: #405b35;
    --dorado: #d6a64c;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Georgia, serif;
    color: #382719;
    background: #d8c39a;
}

button {
    font: inherit;
    cursor: pointer;
}

.pantalla {
    min-height: 100vh;
    display: none;
    padding: 28px 18px;
}

.pantalla.activa {
    display: flex;
}

/* PANTALLA PRINCIPAL */

#inicio {
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    text-align: center;
    background: linear-gradient(
        #9fc4c0 0%,
        #d6d0a0 52%,
        #82935b 53%,
        #53683c 100%
    );
}

#inicio::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(ellipse at 50% 70%,
        #e5d18a 0 12%, transparent 42%),
        linear-gradient(170deg,
        transparent 0 57%, #778b50 57% 68%, #50673a 68%);
}

.sol {
    position: absolute;
    top: 10%;
    right: 16%;
    width: 78px;
    height: 78px;
    border-radius: 50%;
    background: #f6d78a;
    box-shadow: 0 0 45px #f6d78a88;
}

/* ARBOLES */

.arbol {
    position: absolute;
    bottom: 23%;
    width: 130px;
    height: 190px;
    z-index: 1;
}

.arbol::before {
    content: "";
    position: absolute;
    bottom: 0;
    left: 59px;
    width: 15px;
    height: 95px;
    background: #59412c;
}

.arbol::after {
    content: "";
    position: absolute;
    left: 8px;
    top: 0;
    width: 115px;
    height: 120px;
    border-radius: 48% 52% 42% 58%;
    background: #405b35;
    box-shadow:
        18px 25px 0 -8px #4d6939,
        -16px 28px 0 -10px #354d2c;
}

.arbol.izquierda {
    left: 5%;
}

.arbol.derecha {
    right: 6%;
    transform: scale(.8);
}

/* GAUCHO */

.gaucho {
    position: absolute;
    bottom: 24%;
    right: 27%;
    z-index: 1;
    width: 95px;
    height: 155px;
    opacity: .85;
}

.gaucho::before {
    content: "";
    position: absolute;
    left: 33px;
    top: 30px;
    width: 27px;
    height: 30px;
    border-radius: 50%;
    background: #382719;
    box-shadow: 0 -10px 0 -3px #382719;
}

.gaucho::after {
    content: "";
    position: absolute;
    left: 22px;
    top: 58px;
    width: 48px;
    height: 90px;
    background: #382719;
    clip-path: polygon(30% 0,70% 0,100% 100%,0 100%);
}

.gaucho i {
    position: absolute;
    left: 16px;
    top: 26px;
    width: 60px;
    height: 9px;
    background: #382719;
    transform: rotate(-5deg);
    z-index: 2;
}

/* TITULO */

.contenido-inicio {
    position: relative;
    z-index: 3;
    margin-top: 8vh;
    max-width: 720px;
}

.mate {
    font-size: 66px;
    margin-bottom: 4px;
}

h1 {
    font-size: clamp(2.7rem, 8vw, 5.5rem);
    margin: 0;
    color: #fff2d2;
    text-shadow: 3px 4px 0 #56351f;
    letter-spacing: 2px;
}

.subtitulo {
    font-size: 1.15rem;
    color: #fff3d7;
    margin: 8px 0 34px;
}

/* BOTONES DE MADERA */

.boton-madera {
    border: 4px solid #4d2c18;
    border-radius: 8px;
    padding: 16px 34px;
    background: linear-gradient(
        #b77a3e,
        #754322 55%,
        #5b351e
    );
    color: #fff0c9;
    font-weight: bold;
    font-size: 1.35rem;
    letter-spacing: 1px;
    box-shadow: 0 8px 0 #3b2619;
    transition: .15s;
}

.boton-madera:hover {
    transform: translateY(3px);
}

/* MENU DE JUEGOS */

#juegos, #partida {
    background: radial-gradient(
        ellipse at top,
        #f7edcf,
        #d5bd8d
    );
    align-items: center;
    justify-content: center;
}

.contenedor {
    width: min(100%, 950px);
    margin: auto;
}

.linea-superior {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 24px;
}

h2 {
    font-size: clamp(2rem, 5vw, 3.2rem);
    margin: 0;
    color: #55351f;
}

.boton-chico {
    border: 2px solid #684324;
    border-radius: 7px;
    background: #f3e2b9;
    color: #50351f;
    padding: 9px 14px;
    font-weight: bold;
}

.introduccion {
    margin: 8px 0 22px;
    font-size: 1.1rem;
}

.grilla-juegos {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
}

.tarjeta {
    background: #fff5dc;
    border: 2px solid #a77b45;
    border-radius: 12px;
    padding: 20px;
    text-align: left;
    box-shadow: 0 5px 0 #a77b45;
    transition: .15s;
}

.tarjeta:hover {
    transform: translateY(-4px);
    background: #fff9e9;
}

.emoji {
    font-size: 2.5rem;
}

.tarjeta h3 {
    margin: 8px 0 5px;
    font-size: 1.35rem;
}

.tarjeta p {
    margin: 0;
    line-height: 1.4;
    color: #6b5238;
}

/* JUEGOS */

.panel {
    background: #fff5dc;
    border: 3px solid #a77b45;
    border-radius: 14px;
    padding: clamp(18px, 4vw, 32px);
    box-shadow: 0 8px 0 #a77b45;
    max-width: 720px;
    margin: auto;
}

.panel h3 {
    font-size: 1.7rem;
    margin: 0 0 10px;
}

.pregunta {
    font-size: 1.25rem;
    line-height: 1.5;
    margin: 18px 0;
}

.respuestas {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.respuesta {
    border: 2px solid #987044;
    border-radius: 8px;
    padding: 12px;
    background: #f0dfb9;
    color: #3d2b1c;
    text-align: left;
    font-weight: bold;
}

.respuesta:hover {
    background: #e6c98f;
}

.respuesta:disabled {
    cursor: default;
    opacity: .85;
}

.feedback {
    min-height: 30px;
    font-weight: bold;
    margin: 14px 0 4px;
}

.correcto {
    color: #28602e;
}

.incorrecto {
    color: #a13225;
}

.progreso {
    font-size: .95rem;
    color: #725638;
}

.letra {
    font-size: 2.5rem;
    font-weight: bold;
    color: #80502b;
    border: 3px solid #80502b;
    border-radius: 50%;
    width: 72px;
    height: 72px;
    display: grid;
    place-items: center;
    margin: 12px auto;
}

input[type=text] {
    width: 100%;
    padding: 13px;
    border: 2px solid #987044;
    border-radius: 8px;
    font: inherit;
    font-size: 1.05rem;
    background: #fffdf5;
}

.acciones {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 16px;
}

.oculto {
    display: none !important;
}

@media(max-width:560px) {
    .respuestas {
        grid-template-columns: 1fr;
    }

    .arbol.izquierda {
        left: -35px;
    }

    .arbol.derecha {
        right: -40px;
    }

    .gaucho {
        right: 15%;
        transform: scale(.8);
    }
}
</style>
</head>

<body>

<!-- PANTALLA DE INICIO -->

<section id="inicio" class="pantalla activa">

    <div class="sol"></div>

    <div class="arbol izquierda"></div>
    <div class="arbol derecha"></div>

    <div class="gaucho">
        <i></i>
    </div>

    <div class="contenido-inicio">

        <div class="mate">🧉</div>

        <h1>CLÁSICO<br>ARGENTINO</h1>

        <p class="subtitulo">
            Tradición, juegos y cultura de nuestra tierra
        </p>

        <button class="boton-madera" onclick="mostrarJuegos()">
            Iniciar juegos
        </button>

    </div>
</section>


<!-- MENU DE JUEGOS -->

<section id="juegos" class="pantalla">

    <main class="contenedor">

        <div class="linea-superior">

            <h2>Juegos criollos</h2>

            <button class="boton-chico" onclick="mostrarInicio()">
                ← Inicio
            </button>

        </div>

        <p class="introduccion">
            Elegí un juego y poné a prueba cuánto sabés
            de nuestras costumbres.
        </p>

        <div class="grilla-juegos">

            <button class="tarjeta" onclick="iniciarJuego('pasapalabra')">
                <div class="emoji">🔤</div>
                <h3>1. Pasapalabra</h3>
                <p>Resolvé las pistas del rosco argentino.</p>
            </button>

            <button class="tarjeta" onclick="iniciarJuego('chancho')">
                <div class="emoji">🐷</div>
                <h3>2. Chancho va</h3>
                <p>Conseguí cuatro cartas iguales.</p>
            </button>

            <button class="tarjeta" onclick="iniciarJuego('dichos')">
                <div class="emoji">💬</div>
                <h3>3. Adiviná el dicho</h3>
                <p>Completá refranes populares.</p>
            </button>

            <button class="tarjeta" onclick="iniciarJuego('provincias')">
                <div class="emoji">🗺️</div>
                <h3>4. ¿De qué provincia?</h3>
                <p>Descubrí lugares y tradiciones argentinas.</p>
            </button>

            <button class="tarjeta" onclick="iniciarJuego('trivia')">
                <div class="emoji">🧉</div>
                <h3>5. Desafío criollo</h3>
                <p>Una trivia sobre cultura argentina.</p>
            </button>

        </div>
    </main>
</section>


<!-- PANTALLA DE PARTIDA -->

<section id="partida" class="pantalla">

    <main class="contenedor">

        <div class="linea-superior">

            <button class="boton-chico" onclick="mostrarJuegos()">
                ← Juegos
            </button>

            <span class="progreso" id="puntaje">
                Puntos: 0
            </span>

        </div>

        <div class="panel" id="panel-juego"></div>

    </main>
</section>


<script>

// VARIABLES PRINCIPALES

const obtener = id => document.getElementById(id);

let puntos = 0;
let indice = 0;
let juegoActual = "";
let preguntas = [];
let respondido = false;


// CAMBIAR PANTALLAS

function mostrarPantalla(id) {

    document.querySelectorAll(".pantalla").forEach(p => {
        p.classList.remove("activa");
    });

    obtener(id).classList.add("activa");
}

function mostrarInicio() {
    mostrarPantalla("inicio");
}

function mostrarJuegos() {
    mostrarPantalla("juegos");
}


// PREGUNTAS DE LOS JUEGOS

const juegos = {

    dichos: [
        {
            pregunta: "A caballo regalado...",
            opciones: [
                "No se le miran los dientes",
                "Hay que cuidarlo mucho",
                "Se lo lleva el vecino"
            ],
            correcta: 0
        },
        {
            pregunta: "Más vale pájaro en mano...",
            opciones: [
                "Que cien volando",
                "Que uno en el árbol",
                "Que perder el camino"
            ],
            correcta: 0
        },
        {
            pregunta: "No hay mal que por bien...",
            opciones: [
                "No venga",
                "No se pueda arreglar",
                "No termine"
            ],
            correcta: 0
        },
        {
            pregunta: "Al que madruga...",
            opciones: [
                "Dios lo ayuda",
                "Le da más sueño",
                "Llega tarde"
            ],
            correcta: 0
        },
        {
            pregunta: "Camarón que se duerme...",
            opciones: [
                "Se lo lleva la corriente",
                "Sueña con el mar",
                "No encuentra agua"
            ],
            correcta: 0
        }
    ],

    provincias: [
        {
            pregunta: "¿Dónde se realiza el Festival de Cosquín?",
            opciones: ["Córdoba", "Mendoza", "Misiones"],
            correcta: 0
        },
        {
            pregunta: "¿En qué provincia está el glaciar Perito Moreno?",
            opciones: ["Santa Cruz", "Jujuy", "Entre Ríos"],
            correcta: 0
        },
        {
            pregunta: "¿Dónde están las Cataratas del Iguazú?",
            opciones: ["Misiones", "San Juan", "La Pampa"],
            correcta: 0
        },
        {
            pregunta: "¿Dónde está el Cerro de los Siete Colores?",
            opciones: ["Jujuy", "Chubut", "Buenos Aires"],
            correcta: 0
        },
        {
            pregunta: "¿Dónde se celebra la Fiesta de la Vendimia?",
            opciones: ["Mendoza", "Corrientes", "Formosa"],
            correcta: 0
        }
    ],

    trivia: [
        {
            pregunta: "¿Qué ingrediente se usa para preparar el mate?",
            opciones: ["Yerba mate", "Café molido", "Té negro"],
            correcta: 0
        },
        {
            pregunta: "¿Qué comida argentina se prepara con masa frita?",
            opciones: ["Torta frita", "Medialuna", "Chipá"],
            correcta: 0
        },
        {
            pregunta: "¿Qué baile tradicional argentino se baila en pareja?",
            opciones: ["El gato", "La salsa", "El vals vienés"],
            correcta: 0
        },
        {
            pregunta: "¿Qué prenda típica usa el gaucho?",
            opciones: ["Bombachas de campo", "Pantalón de vestir", "Short"],
            correcta: 0
        },
        {
            pregunta: "¿Qué se comparte en una ronda de mate?",
            opciones: ["El mate", "Café individual", "Gaseosa"],
            correcta: 0
        }
    ]
};


// INICIAR JUEGO

function iniciarJuego(tipo) {

    juegoActual = tipo;
    puntos = 0;
    indice = 0;
    respondido = false;

    obtener("puntaje").textContent = "Puntos: 0";

    mostrarPantalla("partida");

    if (tipo === "pasapalabra") {
        mostrarRosco();
    }
    else if (tipo === "chancho") {
        mostrarChancho();
    }
    else {
        preguntas = juegos[tipo];
        mostrarPregunta();
    }
}


// TITULOS

function tituloJuego() {

    return {
        dichos: "Adiviná el dicho",
        provincias: "¿De qué provincia?",
        trivia: "Desafío criollo"
    }[juegoActual];
}


// PREGUNTAS CON OPCIONES

function mostrarPregunta() {

    const pregunta = preguntas[indice];

    const correcta = pregunta.opciones[pregunta.correcta];

    const opciones = [...pregunta.opciones]
        .sort(() => Math.random() - 0.5);

    pregunta.opciones = opciones;
    pregunta.correcta = opciones.indexOf(correcta);

    obtener("panel-juego").innerHTML = `

        <h3>${tituloJuego()}</h3>

        <div class="progreso">
            Pregunta ${indice + 1} de ${preguntas.length}
        </div>

        <div class="pregunta">
            ${pregunta.pregunta}
        </div>

        <div class="respuestas">

            ${pregunta.opciones.map((opcion, i) => `
                <button class="respuesta" onclick="responder(${i})">
                    ${opcion}
                </button>
            `).join("")}

        </div>

        <div class="feedback" id="feedback"></div>

        <div class="acciones">

            <button class="boton-chico oculto" id="siguiente"
                onclick="siguientePregunta()">
                Siguiente →
            </button>

        </div>
    `;
}


// RESPONDER

function responder(numero) {

    if (respondido) return;

    respondido = true;

    const correcta = preguntas[indice].correcta === numero;

    if (correcta) {

        puntos++;

        obtener("puntaje").textContent = "Puntos: " + puntos;

    }

    obtener("feedback").textContent = correcta
        ? "¡Muy bien! Respuesta correcta."
        : "¡Casi! La respuesta correcta era: " +
          preguntas[indice].opciones[preguntas[indice].correcta];

    obtener("feedback").className =
        "feedback " + (correcta ? "correcto" : "incorrecto");

    document.querySelectorAll(".respuesta").forEach(b => {
        b.disabled = true;
    });

    obtener("siguiente").classList.remove("oculto");
}


// SIGUIENTE PREGUNTA

function siguientePregunta() {

    indice++;
    respondido = false;

    if (indice < preguntas.length) {
        mostrarPregunta();
    }
    else {
        terminarJuego();
    }
}


// PASAPALABRA

const rosco = [
    {
        letra: "A",
        pista: "Comida argentina muy típica que se prepara a la parrilla.",
        respuesta: "ASADO"
    },
    {
        letra: "B",
        pista: "Animal de campo cuya lana se usa para hacer abrigo.",
        respuesta: "BORREGO"
    },
    {
        letra: "C",
        pista: "Lugar donde se crían animales y se trabaja la tierra.",
        respuesta: "CAMPO"
    },
    {
        letra: "G",
        pista: "Hombre de campo, jinete y figura de la tradición argentina.",
        respuesta: "GAUCHO"
    },
    {
        letra: "T",
        pista: "Recipiente que suele llevar agua caliente para cebar mate.",
        respuesta: "TERMO"
    }
];


function mostrarRosco() {

    const item = rosco[indice];

    obtener("panel-juego").innerHTML = `

        <h3>Pasapalabra argentino</h3>

        <div class="progreso">
            Letra ${indice + 1} de ${rosco.length}
        </div>

        <div class="letra">${item.letra}</div>

        <div class="pregunta">${item.pista}</div>

        <input id="palabra" type="text"
            placeholder="Escribí tu respuesta..."
            autocomplete="off">

        <div class="feedback" id="feedback"></div>

        <div class="acciones">

            <button class="boton-chico" onclick="comprobarPalabra()">
                Comprobar
            </button>

            <button class="boton-chico" onclick="pasarPalabra()">
                Pasapalabra →
            </button>

        </div>
    `;
}


function comprobarPalabra() {

    if (respondido) return;

    let valor = obtener("palabra").value.trim().toUpperCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "");

    if (!valor) {
        obtener("feedback").textContent = "Escribí una respuesta primero.";
        return;
    }

    respondido = true;

    const respuesta = rosco[indice].respuesta;

    if (valor === respuesta) {

        puntos++;

        obtener("puntaje").textContent = "Puntos: " + puntos;

        obtener("feedback").textContent = "¡Correcto!";

        obtener("feedback").className = "feedback correcto";

    } else {

        obtener("feedback").textContent =
            "La respuesta era " + respuesta + ".";

        obtener("feedback").className = "feedback incorrecto";

    }

    obtener("palabra").disabled = true;

    agregarSiguienteRosco();
}


function pasarPalabra() {

    if (respondido) return;

    respondido = true;

    obtener("feedback").textContent =
        "La respuesta era " + rosco[indice].respuesta + ".";

    agregarSiguienteRosco();
}


function agregarSiguienteRosco() {

    const boton = document.createElement("button");

    boton.className = "boton-chico";
    boton.textContent = "Siguiente →";
    boton.onclick = siguienteRosco;

    obtener("panel-juego").querySelector(".acciones")
        .appendChild(boton);
}


function siguienteRosco() {

    indice++;
    respondido = false;

    if (indice < rosco.length) {
        mostrarRosco();
    } else {
        terminarJuego();
    }
}


// CHANCHO VA

function mostrarChancho() {

    const mazo = [
        "🐷", "🐷", "🐷", "🐷",
        "🐮", "🐮", "🐮", "🐮",
        "🐔", "🐔", "🐔", "🐔",
        "🐴", "🐴", "🐴", "🐴"
    ];

    let mano = mazo.sort(() => Math.random() - 0.5).slice(0, 4);

    window.manoChancho = mano;
    window.cambios = 0;
    window.ganoChancho = false;

    obtener("panel-juego").innerHTML = `

        <h3>Chancho va</h3>

        <div class="progreso">Desafío individual</div>

        <div class="pregunta">
            Tenés cuatro cartas. Elegí una para cambiarla
            por otra al azar. ¡Conseguí cuatro animales iguales!
        </div>

        <div class="respuestas">

            ${mano.map((carta, i) => `
                <button class="respuesta"
                    onclick="cambiarCarta(${i})">
                    ${carta}
                </button>
            `).join("")}

        </div>

        <div class="feedback" id="feedback">
            Cambios realizados: 0 de 8
        </div>

        <div class="acciones">

            <button class="boton-chico" onclick="mostrarChancho()">
                Repartir de nuevo
            </button>

            <button class="boton-chico" onclick="mostrarJuegos()">
                Volver a juegos
            </button>

        </div>
    `;
}


function cambiarCarta(numero) {

    if (window.ganoChancho || window.cambios >= 8) return;

    const animales = ["🐷", "🐮", "🐔", "🐴"];

    window.manoChancho[numero] =
        animales[Math.floor(Math.random() * animales.length)];

    window.cambios++;

    document.querySelectorAll(".respuesta").forEach((b, i) => {
        b.textContent = window.manoChancho[i];
    });

    if (window.manoChancho.every(c => c === window.manoChancho[0])) {

        window.ganoChancho = true;

        puntos++;

        obtener("puntaje").textContent = "Puntos: " + puntos;

        obtener("feedback").textContent =
            "¡CHANCHO! Juntaste cuatro iguales. ¡Ganaste!";

        obtener("feedback").className = "feedback correcto";

        document.querySelectorAll(".respuesta").forEach(b => {
            b.disabled = true;
        });

    } else if (window.cambios >= 8) {

        obtener("feedback").textContent =
            "Se terminaron los cambios. ¡Probá otra vez!";

        obtener("feedback").className = "feedback incorrecto";

        document.querySelectorAll(".respuesta").forEach(b => {
            b.disabled = true;
        });

    } else {

        obtener("feedback").textContent =
            "Cambios realizados: " + window.cambios + " de 8. ¡Seguí intentando!";

    }
}


// TERMINAR JUEGO

function terminarJuego() {

    obtener("panel-juego").innerHTML = `

        <h3>¡Juego terminado!</h3>

        <div class="pregunta">
            Conseguíste <strong>${puntos}</strong> puntos.
        </div>

        <p>¡Gracias por jugar a Clásico Argentino!</p>

        <div class="acciones">

            <button class="boton-madera"
                onclick="iniciarJuego('${juegoActual}')">
                Volver a jugar
            </button>

            <button class="boton-chico" onclick="mostrarJuegos()">
                Elegir otro juego
            </button>

        </div>
    `;
}

</script>
